{% extends "layout.html" %}

{% block title %}
    Log In
{% endblock %}

{% block main %}
    <form action="/login" method="post" >
        <div class="input-group mb-3">
            <input autocomplete="off" autofocus  class="form-control " name="username" placeholder="Username" type="text">
        </div>
        <div class="input-group mb-3">
            <input class="form-control" name="password" placeholder="Password" type="password">
            <button class="btn btn-outline-success btn-outline-secondary" type="submit">Log In</button>
        </div>
    </form>

    <form action="/change" method="get" >
        <div class="input-group mb-3">
            <button class="btn btn-outline-success d-grid gap-2 col-6 mx-auto" type="submit">Change Password</button>
        </div>
    </form>
{% endblock %}
