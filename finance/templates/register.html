{% extends "layout.html" %}

{% block main %}

<form action="/register" method = "post">
    <div class="form-floating mb-3">
    <input name="username" placeholder="username" autofocus autocomplete="off" class="form-control" id="floatingInput">
    <label for="floatingInput">Username</label>
</div>
    <div class="input-group form-floating mb-3" >
    <input name="password" type="password" placeholder="password" autofocus autocomplete="off" class="form-control" id="floatingPassword">
    <label for="floatingPassword">Password</label>
</div>
    <div class="input-group form-floating mb-3">
    <input name="confirmation" type="password" placeholder="confirm password" autofocus autocomplete="off" class="form-control" id="ConfirmfloatingPassword">
    <label for="ConfirmfloatingPassword">Confirm Password</label>
    <button type="submit" class="btn btn-outline-secondary">Register</button>
    </div>
</form>
{% endblock %}
