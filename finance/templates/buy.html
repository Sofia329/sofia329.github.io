{% extends "layout.html" %}

{% block main %}

<form action="/buy" method="post">
    <div class="form-group mb-3">
        <input name="symbol" placeholder="symbol" autofocus autocomplete="off"  class="form-control">
    </div>
    <div class="form-group mb-3">
        <input name="shares" placeholder="no. of shares" type ="Number" autofocus autocomplete="off" class="form-control">
    </div>
    <div class="d-grid gap-2 col-6 mx-auto">
        <button type="submit" class="btn btn-success">confirm buy</button>
    </div>
</form>

{% endblock %}
