{% extends "layout.html" %}

{% block main %}

<form action="/quote" method="post">
    <div class="form-group mb-3">
        <input name="symbol" type="text" autofocus autocomplete="off" placeholder="stock ticker" class="form-control">
    </div>
    <div class="form-group mb-3">
        <button type="submit" class="btn btn-success">Extract Price</button>
    </div>
</form>

{% endblock %}
