<!DOCTYPE html>
<html lang = "en">
    <head>
        <title>Google Image Search</title>
        <style>
            body{
                display:flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                position: relative;
            }

            #nav {
                position: absolute;
                top: 10px;
                right: 5px;
                font-size: 20px;
                font-family: Verdana, Tahoma, sans-serif;
            }

            #nav > a:hover {
                background-color: beige;
            }

            .container{
                display: flex;
                flex-direction:column;
                gap: 1rem;
            }
            .container input {
                box-sizing:content-box;
                width: 300px;
                border-radius: 10px;
                font-size: 20px;
                padding: 20px;
                border: 3px solid cadetblue;
            }
            .container input[type="submit"]{

                font-family: Verdana, Tahoma, sans-serif;
                background-color: beige;
            }

        </style>
    </head>
    <body>
        <nav id="nav">
            <a href="/index.html">Google Search</a>
        </nav>
        <form action="https://google.com/search"  class="container">
            <input type="text" name="q" id="text" placeholder="Search Images">
            <input type="hidden" name="udm" value=2>
            <input type="submit" value="Google Image Search">
        </form>
    </body>
</html>
