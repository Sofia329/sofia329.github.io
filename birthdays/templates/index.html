<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="/static/styles.css" rel="stylesheet">
        <title>Birthdays</title>
    </head>
    <body>
        <div class="header">
            <h1>Birthdays</h1>
        </div>
        <div class="container">
            <div class="section">

                <h2>Add a Birthday</h2>
                <form action="/" method = "post">
                    <input name = "name" placeholder="name"  type="text" autofocus autocomplete="off">
                    <input name = "month" placeholder = "month" type="number" min="1" max = "12" autofocus autocomplete = "off">
                    <input name = "day" placeholder = "day" type="number" min="1" max="31" autofocus autocomplete = "off">
                    <input type = "submit" value="Add Birthday">
                </form>
            </div>

            <div class="section">

                <h2>All Birthdays</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Birthday</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for student in all_records %}
                            <tr>
                                <td>{{student["name"]}}</td>
                                <td>{{student["birthday"]}}</td>
                                <td>
                                    <form action="/deregister" method="post">
                                        <input name="id" type = "hidden" value = '{{student["id"]}}'>
                                        <input type="submit" value="deregister">
                                    </form>
                                </td>
                            </tr>


                        {% endfor %}

                    </tbody>
                </table>
            </div>
        </div>
    </body>
</html>
