<!DOCTYPE html>
<html lang="en">
    <head>
        <title> Google Search</title>
        <style>

            body{
                display:flex;
                justify-content: center;
                align-items: center;
                font-family: Verdana, Tahoma, sans-serif;
                height:100vh;
                position:relative;

            }

            #nav{
                display: flex;
                justify-content: space-between;
                align-items: flex-end;
                font-size: 20px;
                gap: 1rem;
                position: absolute;
                top: 10px;
                right: 5px;
            }

            #nav > a:hover {
                background-color: beige;
            }

            .container{
                display: flex;
                flex-direction:column;
                gap: 1rem;

            }

            .container input{
                box-sizing:content-box;
                border-radius: 5px;
                padding: 20px;
                border: 3px solid cadetblue;
                width: 300px;
                font-size: 20px;
                font-family: Verdana, Tahoma, sans-serif;
            }

            .container > input:nth-child(2){
                background-color: beige;
            }

        </style>

    </head>

    <body>
        <nav id="nav">
            <a href="/image.html">Google Image Search</a>
            <a href="/advanced.html">Google Advanced Search</a>
        </nav>
        <form action="https://google.com/search" class="container">
            <input type="text" name="q" id="text" placeholder="Google Search">
            <input type="submit" value="Google Search">
            <input type="submit" name="btnI" value="I'm Feeling Lucky">
        </form>
    </body>
</html>
