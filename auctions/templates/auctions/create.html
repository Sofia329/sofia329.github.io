{% extends "auctions/layout.html" %}

{% block style %}

<style>

#box{
    display: grid;
    grid-template-columns: minmax(200px, 600px);
    gap:50px;

}

#id_category , #id_condition, #id_start_bid, #id_image, #id_title, #id_description{
    padding: 10px;
    border: 2px solid whitesmoke;
    border-radius: 6px;
    background: white;
}

#id_description{
    width:100%;
}

</style>

{% endblock %}

{% block body %}

<h2>Complete your Listing</h2><hr> 

<form id="box" action = "{% url 'create' %}" method="post"> 
    {% csrf_token %}

    {{form}}

    <input class="btn btn-primary" type="submit" value="Create Listing"> 

</form>

{% endblock %}
